<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif" role="img" aria-label="Как проходит интеграция"><rect width="900" height="280" fill="#ffffff" rx="14"/><rect x="1" y="1" width="898" height="278" fill="none" stroke="#e1e0d9" rx="13"/><text x="36" y="52" font-size="24" font-weight="700" fill="#0b0b0b">Как проходит интеграция</text><rect x="36" y="96" width="128" height="118" fill="#f4f4f1" rx="12"/><rect x="36" y="96" width="128" height="6" fill="#52514e" rx="3"/><text x="100.0" y="142" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Аудит систем</text><text x="100.0" y="184" font-size="12.5" fill="#52514e" text-anchor="middle">что и куда</text><text x="100.0" y="201" font-size="12.5" fill="#52514e" text-anchor="middle">связываем</text><path d="M 172 155.0 l 26 0 m -8 -8 l 8 8 l -8 8" stroke="#2a78d6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="210" y="96" width="128" height="118" fill="#f4f4f1" rx="12"/><rect x="210" y="96" width="128" height="6" fill="#2a78d6" rx="3"/><text x="274.0" y="142" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Коннекторы</text><text x="274.0" y="184" font-size="12.5" fill="#52514e" text-anchor="middle">1С, телефония,</text><text x="274.0" y="201" font-size="12.5" fill="#52514e" text-anchor="middle">сайт, каналы</text><path d="M 346 155.0 l 26 0 m -8 -8 l 8 8 l -8 8" stroke="#2a78d6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="384" y="96" width="128" height="118" fill="#f4f4f1" rx="12"/><rect x="384" y="96" width="128" height="6" fill="#2a78d6" rx="3"/><text x="448.0" y="142" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Обмен данными</text><text x="448.0" y="184" font-size="12.5" fill="#52514e" text-anchor="middle">настройка и</text><text x="448.0" y="201" font-size="12.5" fill="#52514e" text-anchor="middle">маппинг полей</text><path d="M 520 155.0 l 26 0 m -8 -8 l 8 8 l -8 8" stroke="#2a78d6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="558" y="96" width="128" height="118" fill="#f4f4f1" rx="12"/><rect x="558" y="96" width="128" height="6" fill="#2a78d6" rx="3"/><text x="622.0" y="142" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Тест</text><text x="622.0" y="184" font-size="12.5" fill="#52514e" text-anchor="middle">проверка</text><text x="622.0" y="201" font-size="12.5" fill="#52514e" text-anchor="middle">сценариев</text><path d="M 694 155.0 l 26 0 m -8 -8 l 8 8 l -8 8" stroke="#2a78d6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="732" y="96" width="128" height="118" fill="#f4f4f1" rx="12"/><rect x="732" y="96" width="128" height="6" fill="#008300" rx="3"/><text x="796.0" y="142" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Продакшен</text><text x="796.0" y="184" font-size="12.5" fill="#52514e" text-anchor="middle">запуск и</text><text x="796.0" y="201" font-size="12.5" fill="#52514e" text-anchor="middle">сопровождение</text></svg>