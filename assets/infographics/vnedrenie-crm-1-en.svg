<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif" role="img" aria-label="Before CRM and after"><rect width="900" height="390" fill="#ffffff" rx="14"/><rect x="1" y="1" width="898" height="388" fill="none" stroke="#e1e0d9" rx="13"/><text x="36" y="52" font-size="24" font-weight="700" fill="#0b0b0b">Before CRM and after</text><rect x="246" y="62" width="295" height="40" fill="#c03535" rx="8"/><text x="393.5" y="88" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Without CRM</text><rect x="555" y="62" width="295" height="40" fill="#008300" rx="8"/><text x="702.5" y="88" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">With CRM</text><rect x="30" y="90" width="840" height="52" fill="#f4f4f1" rx="8"/><text x="42" y="120" font-size="14.5" font-weight="700" fill="#0b0b0b">Leads from 5 channels</text><text x="254" y="111" font-size="14" fill="#52514e">Notebooks, memory,</text><text x="254" y="129" font-size="14" fill="#52514e">chats</text><text x="563" y="120" font-size="14" fill="#52514e">One pipeline</text><text x="42" y="176" font-size="14.5" font-weight="700" fill="#0b0b0b">Forgotten customer</text><text x="254" y="176" font-size="14" fill="#52514e">Nobody noticed</text><text x="563" y="167" font-size="14" fill="#52514e">Overdue task</text><text x="563" y="185" font-size="14" fill="#52514e">visible to the head of sales</text><rect x="30" y="202" width="840" height="52" fill="#f4f4f1" rx="8"/><text x="42" y="232" font-size="14.5" font-weight="700" fill="#0b0b0b">Manager leaves</text><text x="254" y="232" font-size="14" fill="#52514e">History left with them</text><text x="563" y="232" font-size="14" fill="#52514e">History in the record</text><text x="42" y="288" font-size="14.5" font-weight="700" fill="#0b0b0b">Sales figures</text><text x="254" y="288" font-size="14" fill="#52514e">Based on gut feel</text><text x="563" y="279" font-size="14" fill="#52514e">Pipeline and conversion</text><text x="563" y="297" font-size="14" fill="#52514e">by stage</text></svg>